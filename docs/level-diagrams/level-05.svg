<text x="2540.0" y="219.0" font-family="sans-serif" font-size="22" fill="#263445">P  Platform (top = landing height)</text>
<text x="2540.0" y="253.0" font-family="sans-serif" font-size="22" fill="#263445">S  Scout     D  Hunter drone</text>
<text x="2540.0" y="287.0" font-family="sans-serif" font-size="22" fill="#263445">A  Asteroid  G  Moving gate</text>
