<text x="2540.0" y="355.0" font-family="sans-serif" font-size="22" fill="#263445">W  Gravity well   M  Meteor</text>
<text x="2540.0" y="389.0" font-family="sans-serif" font-size="22" fill="#263445"></text>
<text x="2540.0" y="423.0" font-family="sans-serif" font-size="22" fill="#263445">MOVEMENT GUIDES</text>
<text x="2540.0" y="457.0" font-family="sans-serif" font-size="22" fill="#263445">Dashed boxes: center ranges.</text>
<text x="2540.0" y="491.0" font-family="sans-serif" font-size="22" fill="#263445">Drones: nominal patrol only;</text>
<text x="2540.0" y="525.0" font-family="sans-serif" font-size="22" fill="#263445">can pursue and avoid docks/exit.</text>
<text x="2540.0" y="559.0" font-family="sans-serif" font-size="22" fill="#263445">Meteor trace: first 10 seconds;</text>
<text x="2540.0" y="593.0" font-family="sans-serif" font-size="22" fill="#263445">wraps at flight-lane edges.</text>
<text x="2540.0" y="627.0" font-family="sans-serif" font-size="22" fill="#263445">Wells pull across the whole world.</text>
<text x="2540.0" y="661.0" font-family="sans-serif" font-size="22" fill="#263445">Beam: on 3.0-4.8s of each 6s.</text>
<text x="2540.0" y="695.0" font-family="sans-serif" font-size="22" fill="#263445"></text>
<text x="2540.0" y="729.0" font-family="sans-serif" font-size="22" fill="#263445">INITIAL CENTERS (X, Y)</text>
<text x="2540.0" y="763.0" font-family="sans-serif" font-size="22" fill="#263445">A1   (970, 540)</text>
<text x="2540.0" y="793.0" font-family="sans-serif" font-size="22" fill="#263445">G1   (1040, 670)</text>
<text x="2540.0" y="823.0" font-family="sans-serif" font-size="22" fill="#263445">S1   (530, 350)</text>
